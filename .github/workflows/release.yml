name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build Desktop Installer (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js & Tauri Desktop App
        working-directory: frontend
        run: npm run tauri:build

      - name: Package Desktop Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop

          # Collect NSIS .exe setup installer if present
          $nsis = Get-ChildItem -Path "frontend/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName -Destination "dist-desktop/Sentinel-Desktop-Setup-x64.exe"
            Write-Host "Found NSIS Setup: $($nsis.FullName)"
          } else {
            Write-Host "No NSIS installer found under bundle/nsis/"
          }

          # Collect MSI installer if present
          $msi = Get-ChildItem -Path "frontend/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName -Destination "dist-desktop/Sentinel-Desktop-x64.msi"
            Write-Host "Found MSI Installer: $($msi.FullName)"
          } else {
            Write-Host "No MSI installer found under bundle/msi/"
          }

          # Collect standalone/portable .exe and create portable zip
          $standalone = Get-ChildItem -Path "frontend/src-tauri/target/release/*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike "*setup*" -and $_.Name -notlike "*installer*" } | Select-Object -First 1
          if ($standalone) {
            Compress-Archive -Path $standalone.FullName -DestinationPath "dist-desktop/Sentinel-Desktop-Portable-x64.zip" -Force
            Write-Host "Packaged Standalone Portable Zip from: $($standalone.FullName)"
          } elseif (Test-Path "frontend/src-tauri/target/release/sentinel.exe") {
            Compress-Archive -Path "frontend/src-tauri/target/release/sentinel.exe" -DestinationPath "dist-desktop/Sentinel-Desktop-Portable-x64.zip" -Force
            Write-Host "Packaged Standalone Portable Zip from frontend/src-tauri/target/release/sentinel.exe"
          } else {
            Write-Host "No standalone .exe found under frontend/src-tauri/target/release/"
          }

          # Verify at least one desktop artifact was collected
          $collected = Get-ChildItem -Path dist-desktop -File
          if (-not $collected -or $collected.Count -eq 0) {
            Write-Error "Build failed: Zero desktop artifacts were produced in dist-desktop!"
            exit 1
          }

          Write-Host "Desktop artifacts collected:"
          $collected | ForEach-Object { Write-Host " - $($_.Name) ($($_.Length) bytes)" }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: dist-desktop/*

  build-backend-binaries:
    name: Build Relay Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sentinel-backend-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: sentinel-backend-linux-x86_64.tar.gz
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build Release Binary
        working-directory: backend
        run: cargo build --release

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path backend/target/release/sentinel-backend.exe -DestinationPath sentinel-backend-windows-x64.zip -Force

      - name: Package Binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          strip backend/target/release/sentinel-backend || true
          tar -czvf sentinel-backend-linux-x86_64.tar.gz -C backend/target/release sentinel-backend

      - name: Upload Backend Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop-windows, build-backend-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name || github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "Error: Tag name could not be determined."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Sentinel Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
