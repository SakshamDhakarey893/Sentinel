name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.0)"
        required: false
        default: "manual-build"

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build Desktop Installer (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sentinel/frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel/frontend/src-tauri

      - name: Install Frontend Dependencies
        working-directory: sentinel/frontend
        run: npm ci

      - name: Build Next.js & Tauri Desktop App
        working-directory: sentinel/frontend
        run: npm run tauri:build

      - name: Package Desktop Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop
          
          # Find NSIS .exe setup installer
          $nsis = Get-ChildItem -Path sentinel/frontend/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName -Destination "dist-desktop/Sentinel-Desktop-Setup-x64.exe"
            Write-Host "Found NSIS Setup: $($nsis.FullName)"
          }

          # Find MSI installer
          $msi = Get-ChildItem -Path sentinel/frontend/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName -Destination "dist-desktop/Sentinel-Desktop-x64.msi"
            Write-Host "Found MSI Installer: $($msi.FullName)"
          }

          # Find Standalone .exe and zip it
          $standalone = "sentinel/frontend/src-tauri/target/release/sentinel.exe"
          if (Test-Path $standalone) {
            Compress-Archive -Path $standalone -DestinationPath "dist-desktop/Sentinel-Desktop-Portable-x64.zip" -Force
            Write-Host "Packaged Standalone Portable Zip"
          }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: dist-desktop/*

  build-backend-binaries:
    name: Build Relay Server Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sentinel-backend-windows-x64.zip
            binary_src: sentinel/backend/target/release/sentinel-backend.exe
            archive_cmd: pwsh
            archive_script: |
              Compress-Archive -Path sentinel/backend/target/release/sentinel-backend.exe -DestinationPath sentinel-backend-windows-x64.zip -Force
          - os: ubuntu-latest
            artifact_name: sentinel-backend-linux-x86_64.tar.gz
            binary_src: sentinel/backend/target/release/sentinel-backend
            archive_cmd: bash
            archive_script: |
              strip sentinel/backend/target/release/sentinel-backend
              tar -czvf sentinel-backend-linux-x86_64.tar.gz -C sentinel/backend/target/release sentinel-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel/backend

      - name: Build Release Binary
        working-directory: sentinel/backend
        run: cargo build --release

      - name: Package Binary
        shell: ${{ matrix.archive_cmd }}
        run: ${{ matrix.archive_script }}

      - name: Upload Backend Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop-windows, build-backend-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Sentinel Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
