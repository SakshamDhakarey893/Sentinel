name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests & Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel/backend

      - name: Backend Cargo Check
        working-directory: sentinel/backend
        run: cargo check --verbose

      - name: Backend Tests
        working-directory: sentinel/backend
        run: cargo test --verbose

  test-frontend:
    name: Frontend Static Export (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sentinel/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: sentinel/frontend
        run: npm ci

      - name: Next.js Static Export Build
        working-directory: sentinel/frontend
        run: npm run build
