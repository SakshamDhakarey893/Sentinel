services:
  sentinel-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_PATH=/app/data/sentinel.db
      - RUST_LOG=sentinel_backend=info,tower_http=info
    volumes:
      - ./data:/app/data
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: sentinel-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      sentinel-backend:
        condition: service_healthy
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
