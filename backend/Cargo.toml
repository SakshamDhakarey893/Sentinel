[package]
name = "sentinel-backend"
version = "0.1.0"
edition = "2021"
description = "Sentinel — encrypted messaging backend"
authors = ["Sentinel Project"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
futures-util = "0.3"

# Crypto (later: libsignal integration)
# We will add signal protocol crates when implementing E2EE
